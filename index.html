<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FJU • Experiência AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

a-scene,.a-canvas{
  background:transparent!important
}

#startScreen{
  position:fixed;
  z-index:3000;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(0,0,0,.42);
  transition:opacity .3s ease,visibility .3s ease
}

#startScreen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none
}

.startCard{
  width:min(88vw,390px);
  padding:28px 22px 22px;
  border-radius:24px;
  text-align:center;
  color:white;
  background:rgba(20,20,20,.82);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 60px rgba(0,0,0,.38);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px)
}

.startIcon{font-size:42px;margin-bottom:8px}
.startTitle{margin:0 0 8px;font-size:24px;font-weight:800}
.startText{margin:0 0 20px;color:rgba(255,255,255,.78);font-size:15px;line-height:1.45}

#startButton{
  width:100%;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#fff;
  color:#111;
  font-size:17px;
  font-weight:800
}

#scanUI{
  position:fixed;
  z-index:2000;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease
}

#scanUI.visible{opacity:1}

#guide{
  position:absolute;
  left:50%;
  top:50%;
  width:min(82vw,620px);
  aspect-ratio:1.414/1;
  transform:translate(-50%,-50%)
}

.corner{
  position:absolute;
  width:34px;
  height:34px;
  border-color:rgba(255,255,255,.95);
  border-style:solid;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))
}

.tl{left:0;top:0;border-width:3px 0 0 3px;border-radius:10px 0 0 0}
.tr{right:0;top:0;border-width:3px 3px 0 0;border-radius:0 10px 0 0}
.bl{left:0;bottom:0;border-width:0 0 3px 3px;border-radius:0 0 0 10px}
.br{right:0;bottom:0;border-width:0 3px 3px 0;border-radius:0 0 10px 0}

#scanMessage{
  position:absolute;
  left:50%;
  bottom:max(36px,calc(env(safe-area-inset-bottom) + 24px));
  transform:translateX(-50%);
  width:min(86vw,500px);
  padding:11px 15px;
  border-radius:999px;
  background:rgba(0,0,0,.56);
  color:#fff;
  text-align:center;
  font-size:14px;
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px)
}

#foundToast{
  position:fixed;
  z-index:2200;
  top:max(18px,env(safe-area-inset-top));
  left:50%;
  transform:translate(-50%,-12px);
  padding:9px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:14px;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease,transform .25s ease
}

#foundToast.show{
  opacity:1;
  transform:translate(-50%,0)
}
</style>
</head>

<body>

<div id="startScreen">
  <div class="startCard">
    <div class="startIcon">📱</div>
    <h1 class="startTitle">Experiência FJU</h1>
    <p class="startText">Permita o uso da câmera e depois toque abaixo para começar.</p>
    <button id="startButton">Começar experiência</button>
  </div>
</div>

<div id="scanUI">
  <div id="guide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
  <div id="scanMessage">Enquadre o panfleto dentro da marcação</div>
</div>

<div id="foundToast">✓ Panfleto encontrado</div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./assets/video.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video
      id="videoPlane"
      src="#arVideo"
      position="0 0 0.01"
      width="1.015"
      height="1"
      material="shader: flat;">
    </a-video>
  </a-entity>

</a-scene>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const video = document.querySelector("#arVideo");
  const plane = document.querySelector("#videoPlane");
  const target = document.querySelector("#target");
  const startScreen = document.querySelector("#startScreen");
  const startButton = document.querySelector("#startButton");
  const scanUI = document.querySelector("#scanUI");
  const foundToast = document.querySelector("#foundToast");

  let audioUnlocked = false;
  let targetVisible = false;
  let toastTimer = null;

  video.addEventListener("loadedmetadata", () => {
    if (video.videoWidth && video.videoHeight) {
      const ratio = video.videoHeight / video.videoWidth;
      plane.setAttribute("height", ratio * 1.015);
    }
  });

  // O MindAR inicia a câmera automaticamente.
  // O botão serve apenas para liberar o áudio no iPhone.
  startButton.addEventListener("click", async () => {
    audioUnlocked = true;

    try {
      video.muted = false;
      await video.play();
      video.pause();
      video.currentTime = 0;
    } catch (e) {
      // Mesmo que o Safari não libere agora, tentaremos de novo
      // quando o alvo for encontrado.
    }

    startScreen.classList.add("hidden");
    scanUI.classList.add("visible");
  });

  target.addEventListener("targetFound", async () => {
    targetVisible = true;
    scanUI.classList.remove("visible");

    foundToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      foundToast.classList.remove("show");
    }, 1000);

    try {
      video.currentTime = 0;
      video.muted = !audioUnlocked;
      await video.play();
    } catch (e) {
      try {
        video.muted = true;
        await video.play();
      } catch (_) {}
    }
  });

  target.addEventListener("targetLost", () => {
    targetVisible = false;
    video.pause();
    video.currentTime = 0;
    scanUI.classList.add("visible");
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      video.pause();
    } else if (targetVisible) {
      video.play().catch(() => {});
    }
  });
});
</script>

</body>
</html>
